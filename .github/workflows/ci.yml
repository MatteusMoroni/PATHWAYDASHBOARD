name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintaxe JS e links locais
        run: node scripts/check.mjs
      - name: Validação HTML
        run: npx --yes html-validate@9 "*.html" "dashboards-mvp/*.html"
